[project]
name = "stateguard-spike"
version = "0.1.0"
description = "Frozen StateGuard semantic-mapping benchmark spike"
requires-python = "==3.11.*"
dependencies = [
  "fastapi==0.141.1",
  "google-genai==2.17.0",
  "httpx==0.28.1",
  "pydantic==2.13.4",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
